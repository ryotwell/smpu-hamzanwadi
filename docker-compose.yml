# Service app saja — database di-setup terpisah.
# DATABASE_URL mengarah ke DB milik Anda, contoh:
#   postgresql://user:pass@host.docker.internal:5432/smpu2026
#   (host.docker.internal butuh extra_hosts "host-gateway" di Linux)
#
# docker compose otomatis membaca .env di direktori ini untuk interpolasi
# ${VAR} di bawah (NEXT_PUBLIC_* dipakai saat BUILD, sisanya saat runtime).
services:
  next-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SCHOOL_NPSN: ${NEXT_PUBLIC_SCHOOL_NPSN:-}
        NEXT_PUBLIC_SCHOOL_CONTACT_ADDRESS: ${NEXT_PUBLIC_SCHOOL_CONTACT_ADDRESS:-}
        NEXT_PUBLIC_SCHOOL_CONTACT_EMAIL: ${NEXT_PUBLIC_SCHOOL_CONTACT_EMAIL:-}
        NEXT_PUBLIC_SCHOOL_CONTACT_PHONE: ${NEXT_PUBLIC_SCHOOL_CONTACT_PHONE:-}
        NEXT_PUBLIC_SCHOOL_CONTACT_MAP: ${NEXT_PUBLIC_SCHOOL_CONTACT_MAP:-}
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - APP_NAME=${APP_NAME}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_REGION=${S3_REGION}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - SCHOOL_JENJANG_CODE=${SCHOOL_JENJANG_CODE}
      - SCHOOL_PROV_CODE=${SCHOOL_PROV_CODE}
      - SCHOOL_KAB_CODE=${SCHOOL_KAB_CODE}
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    networks:
      - dokploy-network
      - default

networks:
  dokploy-network:
    external: true
