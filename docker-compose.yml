services:
  next-app:
    container_name: next-app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SCHOOL_NPSN=${NEXT_PUBLIC_SCHOOL_NPSN}
        - NEXT_PUBLIC_SCHOOL_CONTACT_ADDRESS=${NEXT_PUBLIC_SCHOOL_CONTACT_ADDRESS}
        - NEXT_PUBLIC_SCHOOL_CONTACT_EMAIL=${NEXT_PUBLIC_SCHOOL_CONTACT_EMAIL}
        - NEXT_PUBLIC_SCHOOL_CONTACT_PHONE=${NEXT_PUBLIC_SCHOOL_CONTACT_PHONE}
        - NEXT_PUBLIC_SCHOOL_CONTACT_MAP=${NEXT_PUBLIC_SCHOOL_CONTACT_MAP}
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_REGION=${S3_REGION}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - SCHOOL_JENJANG_CODE=${SCHOOL_JENJANG_CODE}
      - SCHOOL_PROV_CODE=${SCHOOL_PROV_CODE}
      - SCHOOL_KAB_CODE=${SCHOOL_KAB_CODE}
    restart: always
    networks:
      - dokploy-network
      - default

networks:
  dokploy-network:
    external: true